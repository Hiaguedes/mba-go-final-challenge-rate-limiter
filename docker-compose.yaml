version: '3.8'

services:
  app:
    build:
      dockerfile: Dockerfile
      context: .
    environment:
      - SERVER_PORT=${SERVER_PORT}
      - REDIS_ADDR=${REDIS_ADDR}
      - REQS_BLOCK_TIME_SEC=${REQS_BLOCK_TIME_SEC}
      - IP_REQS_PER_SEC_LIMITTER=${IP_REQS_PER_SEC_LIMITTER}
      - API_TOKEN_REQS_PER_SEC_LIMITTER=${API_TOKEN_REQS_PER_SEC_LIMITTER}
      - API_TOKEN=${API_TOKEN}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    env_file:
      - .env
    command: sh -c "/server"
    depends_on:
      redis:
        condition: service_healthy
    
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data: